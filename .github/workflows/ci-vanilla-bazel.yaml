name: CI - Vanilla Bazel

# Controls when the action will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  ASPECT_WORKSPACE: ${{ github.workspace }}

jobs:
  smoke:
    # Only run mac/windows tests on main or when the branch name signals it to minimize minutes (billed at 10X and 2X respectively)
    # https://docs.github.com/en/billing/managing-billing-for-github-actions/about-billing-for-github-actions#included-storage-and-minutes
    if: github.ref_name == 'main' || contains(github.head_ref, 'macos') || contains(github.head_ref, 'windows')
    strategy:
      fail-fast: false
      matrix:
        # Note: linux is tested on Buildkite via Aspect Workflows
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    env:
      # Skip Aspect Cloud on Windows and on fork PRs. Windows is not supported by
      # setup-aspect, and fork PRs do not have access to the necessary secrets.
      BAZEL_ASPECT_FLAGS: ${{ matrix.os != 'windows-latest' && secrets.ASPECT_OSS_API_TOKEN != '' && '--config=aspect-cloud' || '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          # Avoid downloading Bazel every time.
          bazelisk-cache: true
          # Store build cache per workflow.
          disk-cache: ${{ github.workflow }}
          # Share repository cache between workflows.
          repository-cache: true
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        if: matrix.os != 'windows-latest'
        with:
          aspect-api-token: ${{ secrets.ASPECT_OSS_API_TOKEN }}
          disk-cache: false
          repository-cache: false
      # Bazel fails the build rather than create the directory the
      # aspect-exec-log group writes into.
      - run: mkdir -p .aspect/generated
        if: matrix.os != 'windows-latest'
        shell: bash
      - name: bazel test //...
        shell: bash
        run: bazel test ${{ env.BAZEL_ASPECT_FLAGS }} //...

  # Stable branch-protection check, matching the Aspect Workflows CI and the
  # conventions in rules_js/rules_ts. The smoke job is deliberately skipped on
  # most pull requests to control macOS/Windows runner costs.
  conclusion:
    needs: [smoke]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          if [[ "${{ needs.smoke.result }}" == "success" || "${{ needs.smoke.result }}" == "skipped" ]]; then
            exit 0
          else
            exit 1
          fi
